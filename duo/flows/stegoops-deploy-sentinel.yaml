# Flow 2 - HANDS-OFF: no human gate. Triggered by pipeline events or issue mention.
# Conforms to the GitLab custom-flow schema: no top-level name/description and
# no response_schemas/response_schema_id (rejected by the Flow builder). Every
# agent's final answer is a plain string: routed components end with EXACTLY one
# routing word; details live in deterministic artifacts (leak_audit.json) that
# the next agent re-reads itself.
# The agent holds no secrets and does not read raw logs: it reads only the deterministic leak_audit.json published by the deploy job.
# Privileged actions (rotation, merge) live in CI (rotate-secrets + auto-merge); agents only VERIFY and REPORT.
version: "v1"
environment: ambient

components:
  - name: "preflight"
    type: AgentComponent
    prompt_id: "preflight_prompt"
    inputs:
      - from: "context:goal"
        as: "trigger"
      - from: "context:project_id"
        as: "project_id"
    toolset: ["get_issue", "run_command", "gitlab_api_get"]
    ui_log_events: ["on_tool_execution_success", "on_tool_execution_failed"]

  - name: "leak_auditor"
    type: AgentComponent
    prompt_id: "auditor_prompt"
    inputs:
      - from: "context:goal"
        as: "trigger"
      - from: "context:project_id"
        as: "project_id"
    toolset: ["gitlab_api_get"]
    ui_log_events: ["on_tool_execution_success", "on_tool_execution_failed"]

  - name: "reporter_blocked"
    type: AgentComponent
    prompt_id: "blocked_reporter_prompt"
    inputs:
      - from: "context:project_id"
        as: "project_id"
      - from: "context:preflight.final_answer"
        as: "decision"
    toolset: ["create_issue_note", "create_issue", "run_command"]
    ui_log_events: ["on_agent_final_answer", "on_tool_execution_failed"]

  - name: "reporter_final"
    type: AgentComponent
    prompt_id: "final_reporter_prompt"
    inputs:
      - from: "context:project_id"
        as: "project_id"
      - from: "context:leak_auditor.final_answer"
        as: "audit"
    toolset: ["create_issue_note", "create_issue"]
    ui_log_events: ["on_agent_final_answer", "on_tool_execution_failed"]

routers:
  - from: "preflight"
    condition:
      input: "context:preflight.final_answer"
      routes:
        "go": "leak_auditor"
        "no_go": "reporter_blocked"
        "skip": "end"
        "default_route": "reporter_blocked"
  - from: "leak_auditor"
    to: "reporter_final"
  - from: "reporter_blocked"
    to: "end"
  - from: "reporter_final"
    to: "end"

flow:
  entry_point: "preflight"

prompts:
  - prompt_id: "preflight_prompt"
    name: "Preflight"
    unit_primitives: []
    prompt_template:
      system: |
        Deploy preflight agent. The trigger is a pipeline event webhook payload (JSON) or an issue link.
        1. Pipeline event: status must be "success" or "failed" and ref must be the default branch.
        2. Find the deploy-staging job (GET /projects/<project_id>/pipelines/<pipeline_id>/jobs). Missing -> skip. Failed -> no_go.
        3. Run: python -m stegoops verify --json . If not ok -> no_go.
        4. Find the latest issue with label stegoops::rotation.
        Do not open carriers or search for keys.
        Your final answer must be EXACTLY one word and nothing else: go, no_go, or skip.
      user: |
        Project ID: {{ project_id }}
        Trigger: {{ trigger }}
      placeholder: history
    params:
      timeout: 240

  - prompt_id: "auditor_prompt"
    name: "Leak auditor"
    unit_primitives: []
    prompt_template:
      system: |
        Read the deploy audit artifact. The trigger is the pipeline event payload; find the deploy-staging
        job ID, then GET /projects/<project_id>/jobs/<job_id>/artifacts/leak_audit.json.
        If the artifact is missing, answer unavailable.
        Otherwise answer in this exact one-line format, nothing else:
        verdict=<clean|leak|unavailable> scrubbed=<number> secrets_loaded=<comma-separated secret names, never values>
      user: |
        Project ID: {{ project_id }}
        Trigger: {{ trigger }}
      placeholder: history
    params:
      timeout: 180

  - prompt_id: "blocked_reporter_prompt"
    name: "Reporter (blocked)"
    unit_primitives: []
    prompt_template:
      system: |
        Deploy is blocked (decision: {{ decision }}). Run: python -m stegoops verify --json to get the problems.
        If a rotation issue exists (label stegoops::rotation), post a short note with the pipeline and the problems.
        If none exists, create a new issue "[Stego-Ops] Deploy problem" with the same content.
        Never write secret values. Return a confirmation when posted.
      user: |
        Project ID: {{ project_id }}
        Decision: {{ decision }}
      placeholder: history
    params:
      timeout: 180

  - prompt_id: "final_reporter_prompt"
    name: "Reporter (final)"
    unit_primitives: []
    prompt_template:
      system: |
        Post the deploy result. The audit line is: {{ audit }}
        - verdict=clean: post a short note that the deploy passed, the scrubber masked the values, and rotation completed.
        - verdict=leak or unavailable: create an issue "[Stego-Ops] Possible leak" naming the secrets to rotate;
          state that STEGOOPS_KEK and the named secrets must be rotated immediately.
        Never write secret values. Return a confirmation when posted.
      user: |
        Project ID: {{ project_id }}
        Audit: {{ audit }}
      placeholder: history
    params:
      timeout: 180
