# Flow 1 - SUPERVISED: one human approval gate. Triggered by mention/assign on MR.
# Conforms to the GitLab custom-flow schema: no top-level name/description and
# no response_schemas/response_schema_id (rejected by the Flow builder). The
# scanner ends with EXACTLY one routing word; other agents re-read the
# deterministic scan_results.json artifact themselves.
# Created in the project: AI > Flows > New flow > Configuration (paste the contents). Trigger: mention/assign on the MR.
version: "v1"
environment: ambient

components:
  - name: "scanner"
    type: AgentComponent
    prompt_id: "scanner_prompt"
    inputs:
      - from: "context:goal"
        as: "mr_link"
      - from: "context:project_id"
        as: "project_id"
    toolset: ["get_merge_request", "run_command", "read_file", "list_dir"]
    ui_log_events: ["on_tool_execution_success", "on_tool_execution_failed"]

  - name: "remediation_planner"
    type: AgentComponent
    prompt_id: "planner_prompt"
    inputs:
      - from: "context:project_id"
        as: "project_id"
      - from: "context:scanner.final_answer"
        as: "verdict"
    toolset: ["read_file", "run_command"]
    ui_log_events: ["on_agent_final_answer", "on_tool_execution_failed"]

  - name: "approval_gate"
    type: HumanInputComponent
    sends_response_to: "remediation_planner"
    interaction_type: "approval"
    inputs:
      - from: "context:scanner.final_answer"
        as: "verdict"
    message_template: |
      PurrGuard found a threat (verdict: {{ verdict }}). The agent proposes cleaning the affected files and a rotation plan.
      Approve: clean the files in a new fix MR and publish the plan
      Reject: publish the report only, without changes
    ui_log_events: ["on_user_input_prompt", "on_user_response"]

  - name: "executor"
    type: AgentComponent
    prompt_id: "executor_prompt"
    inputs:
      - from: "context:project_id"
        as: "project_id"
      - from: "context:goal"
        as: "mr_link"
      - from: "context:remediation_planner.final_answer"
        as: "plan"
    toolset: ["run_command", "create_branch", "create_commit", "create_merge_request", "create_merge_request_note"]
    ui_log_events: ["on_agent_final_answer", "on_tool_execution_failed"]

  - name: "reporter"
    type: AgentComponent
    prompt_id: "reporter_prompt"
    inputs:
      - from: "context:project_id"
        as: "project_id"
      - from: "context:goal"
        as: "mr_link"
      - from: "context:scanner.final_answer"
        as: "verdict"
    toolset: ["create_merge_request_note"]
    ui_log_events: ["on_agent_final_answer", "on_tool_execution_failed"]

routers:
  - from: "scanner"
    condition:
      input: "context:scanner.final_answer"
      routes:
        "threat": "remediation_planner"
        "needs_review": "reporter"
        "clean": "reporter"
        "default_route": "reporter"
  - from: "remediation_planner"
    to: "approval_gate"
  - from: "approval_gate"
    condition:
      input: "context:approval_gate.approval"
      routes:
        "approve": "executor"
        "reject": "reporter"
        "default_route": "reporter"
  - from: "executor"
    to: "end"
  - from: "reporter"
    to: "end"

flow:
  entry_point: "scanner"

prompts:
  - prompt_id: "scanner_prompt"
    name: "Scanner"
    unit_primitives: []
    prompt_template:
      system: |
        Security agent. Run the scanner and classify.
        1. Get the MR source branch from the goal. Fetch/checkout if needed.
        2. Run EXACTLY these two commands, in this order, and nothing else:
           PURRGUARD_MOCK=1 python main.py || true
           python -m stegoops verify --json || true
           Non-zero exit codes are expected and are part of the result - read the JSON output, not the exit code.
        3. Read scan_results.json. Classify: threat for HIGH/CRITICAL; needs_review for
           carrier_resealed/carrier_manifest changes; else clean.
        Never print or quote secret values. Do not open Stego-Ops carriers (no key - intentional).
        Do NOT run history or explore the repository.
        Your final answer must be EXACTLY one word and nothing else: clean, needs_review, or threat.
      user: |
        Project ID: {{ project_id }}
        Merge request: {{ mr_link }}
      placeholder: history
    params:
      timeout: 300

  - prompt_id: "planner_prompt"
    name: "Remediation planner"
    unit_primitives: []
    prompt_template:
      system: |
        Incident response agent. The verdict is: {{ verdict }}.
        Read scan_results.json and propose a plan (do not execute):
        - Files to sanitize: python main.py sanitize <files> (authorized carriers are auto-skipped)
        - Secrets to rotate: from the secrets field in scan_results.json (names only)
        - Whether STEGOOPS_KEK rotation is needed (only if a carrier was swapped or the manifest compromised)
        Never quote secret values. Include human feedback if present.
        Return a short numbered plan.
      user: |
        Project ID: {{ project_id }}
        Verdict: {{ verdict }}
      placeholder: history
    params:
      timeout: 240

  - prompt_id: "executor_prompt"
    name: "Executor"
    unit_primitives: []
    prompt_template:
      system: |
        Execute the approved plan. The plan is:
        {{ plan }}
        1. Sanitize the affected files (python main.py sanitize <files>).
        2. Create branch purrguard/fix-<id>, commit the cleaned files, open an MR to the source branch.
        3. Note the original MR with the plan and the fix MR link.
        Do not merge. Do not mention secret values. Return the fix MR link when done.
      user: |
        Project ID: {{ project_id }}
        Original MR: {{ mr_link }}
        Files: from the approved plan
      placeholder: history
    params:
      timeout: 300

  - prompt_id: "reporter_prompt"
    name: "Reporter"
    unit_primitives: []
    prompt_template:
      system: |
        Post a short report to the MR: verdict ({{ verdict }}), findings from scan_results.json
        (file names and types only), and next steps.
        If clean, state there are no findings. Do not include secret values.
        Return a confirmation when posted.
      user: |
        Project ID: {{ project_id }}
        Merge request: {{ mr_link }}
        Verdict: {{ verdict }}
      placeholder: history
    params:
      timeout: 180
