fail_on: HIGH                 # LOW | MEDIUM | HIGH | CRITICAL
ignore_paths: [.git, node_modules, purrguard_fixed, public]
chi_square_threshold: 0.05    # p-value: natural images give p~0, embedded data - higher
min_zero_width_chars: 1
auto_fix: true                # opens fix MR with sanitized files
history_max_commits: 500
allowlist_sha256: []          # approved files (python main.py allow <file>)
carrier_manifest: .stegoops/manifest.json   # authorized Stego-Ops carriers (SHA-256 pin)
